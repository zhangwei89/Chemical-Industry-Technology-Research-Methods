site_name: 化工行业技术研究方法
site_description: 面向化工方向技术人员做技术调研、对标分析与报告撰写的方法手册。
site_url: https://zhangwei89.github.io/Chemical-Industry-Technology-Research-Methods/
repo_url: https://github.com/zhangwei89/Chemical-Industry-Technology-Research-Methods
repo_name: zhangwei89/Chemical-Industry-Technology-Research-Methods
copyright: Copyright © 2026 zhangwei89

theme:
  name: material
  language: zh
  palette:
    primary: red
    accent: red
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true

plugins:
  - search